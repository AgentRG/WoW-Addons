# This is a basic workflow to help you get started with Actions

name: Zip Mod Folders

# Controls when the workflow will run
on:
  # Triggers the workflow on push event but only for the "main" branch
  push:
    branches: [ "main" ]
    paths:
      - 'HeartAttack/**'
      - 'HumorousDeath/**'
      - 'InterruptReminder/**'
      - 'LibFramePool-1.0/**'
      - 'TalkingHeadShut/**'
      - 'ThreatTrack/**'
      - 'ZoomerWoW/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Create ZIPs folder
        run: mkdir -p _zips

      - name: Delete contents of _zips
        run: |
          rm -rf "_zips/"*

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          zip_addon() {
            local folder="$1"

            echo "Processing $folder"

            cd "$folder" || {
              echo "Failed to enter $folder"
              return 1
            }

            shopt -s nullglob

            local toc_file=(*.toc)
            [[ -f "${toc_file[0]}" ]] || {
              echo "No .toc found in $folder"
              return 1
            }

            local version
            version=$(awk 'NR==2 {print $3}' "${toc_file[0]}")

            local zip_name="../_zips/${folder}_v${version}.zip"

            zip -r "$zip_name" . \
              -x "./_misc/*" \
              -x "*.zip"

            echo "Created $zip_name"
          }
          
          export -f zip_addon
          
          printf '%s\n' \
          "HeartAttack" \
          "HumorousDeath" \
          "InterruptReminder" \
          "LibFramePool-1.0" \
          "TalkingHeadShut" \
          "ThreatTrack" \
          "ZoomerWoW" \
          | xargs -n1 -P2 bash -c 'zip_addon "$@"' _

      - name: Push ZIPs to repo
        run: |
          branch_name=$(date +"%d-%b-%Y-%H-%M-%S")
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git checkout -b "zips_$branch_name"
          git add _zips/*
          git commit -m "Committed ZIP folders"
          git push -u origin "zips_$branch_name"
          gh pr create -B main -H "zips_$branch_name" --title "Merge zips_$branch_name into main" --body 'Created by Github action'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
